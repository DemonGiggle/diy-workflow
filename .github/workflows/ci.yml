name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Build visual editor
        run: npm run build:ui

      - name: Compile tests
        run: npm run test:compile

      - name: Run unit and model tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Validate example workflows
        run: |
          node dist/cli.js validate examples/summarize.yaml
          node dist/cli.js validate examples/fanout.yaml
          node dist/cli.js validate examples/llm-review.yaml
          node dist/cli.js validate examples/mock-e2e.yaml
          node dist/cli.js validate examples/write-summary.yaml
          node dist/cli.js validate examples/write-image.yaml
